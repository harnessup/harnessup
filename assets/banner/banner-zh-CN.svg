      <rect x="78" y="94" width="12" height="15"/><rect x="110" y="94" width="12" height="15"/>
      <rect x="80" y="96" width="4" height="4" fill="#fff"/><rect x="112" y="96" width="4" height="4" fill="#fff"/>
    </g>
    <g fill="#C6FF00"><rect x="90" y="116" width="4" height="4"/><rect x="94" y="120" width="12" height="4"/><rect x="106" y="116" width="4" height="4"/></g>
    <rect x="68" y="116" width="8" height="4" fill="#6E11DF"/><rect x="124" y="116" width="8" height="4" fill="#6E11DF"/>
    <rect x="36" y="146" width="128" height="15" rx="3" fill="#6E11DF" stroke="#0E0E0E" stroke-width="3"/>
