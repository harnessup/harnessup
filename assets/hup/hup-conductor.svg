<svg xmlns="http://www.w3.org/2000/svg" width="270" height="246" viewBox="-30 -6 270 246" role="img" aria-label="Hup, the HarnessUp mascot"><style>.hup-arm{fill:none;stroke:#0E0E0E;stroke-width:9;stroke-linecap:round}.hup-hand{fill:#fff;stroke:#0E0E0E;stroke-width:4}
