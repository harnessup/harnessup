.hup-wave{transform-origin:160px 110px;animation:w 1.1s ease-in-out infinite}@keyframes w{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.hup-body{animation:f 3s ease-in-out infinite}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}</style>
